<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fixture: flex row</title>
<!--
  Flex row at (20,40), 1000x200, gap 20, align-items:flex-start.
    item 1: 100x50  -> x = 20
    item 2: 200x80  -> x = 20 + 100 + 20 = 140
    item 3: 300x120 -> x = 140 + 200 + 20 = 360
  All three sit at y = 40 (flex-start), and flex:none stops any grow/shrink
  from moving the declared widths.
-->
<style>
  html, body { margin: 0; padding: 0; }
  body { background: #fff; }
  .row {
    position: absolute; left: 20px; top: 40px;
    width: 1000px; height: 200px;
    display: flex; flex-direction: row; gap: 20px;
    align-items: flex-start;
    box-sizing: border-box; background: #eee;
  }
  .row > div { flex: none; box-sizing: border-box; background: #bbb; }
</style>
</head>
<body>
  <div class="row" id="exp_20_40_1000_200">
    <div id="exp_20_40_100_50"   style="width:100px; height:50px"></div>
    <div id="exp_140_40_200_80"  style="width:200px; height:80px"></div>
    <div id="exp_360_40_300_120" style="width:300px; height:120px"></div>
  </div>
</body>
</html>
